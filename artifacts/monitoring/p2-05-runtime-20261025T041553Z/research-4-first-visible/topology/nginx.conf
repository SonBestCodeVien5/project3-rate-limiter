events { worker_connections 2048; }
http {
    access_log off;
    upstream api {
        server api1:8080;
        server api2:8080;
        server api3:8080;
        server api4:8080;
        keepalive 64;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }
    }
}
