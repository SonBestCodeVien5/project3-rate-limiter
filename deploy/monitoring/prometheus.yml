global:
  scrape_interval: 2s
  scrape_timeout: 1s

scrape_configs:
  - job_name: project3-demo
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: [api1:8080]
        labels:
          service: api1
      - targets: [api2:8080]
        labels:
          service: api2
      - targets: [backend:8080]
        labels:
          service: backend
  - job_name: project3-console-run
    scrape_interval: 1s
    metrics_path: /metrics/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/console-targets/*.json]
        refresh_interval: 1s
